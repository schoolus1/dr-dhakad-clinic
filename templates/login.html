<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dr. Dhakad Clinic</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1a1f36 0%, #1a73e8 100%); }
    .login-box {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #1a73e8, #34a853);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 12px;
    }
    .login-logo h1 { font-size: 1.3rem; font-weight: 700; color: #202124; }
    .login-logo p { font-size: 0.85rem; color: #5f6368; }
    .error-msg {
      background: #fce8e6;
      color: #c62828;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .login-footer { text-align: center; margin-top: 20px; font-size: 0.75rem; color: #9aa0a6; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🏥</div>
      <h1>Dr. Dhakad Clinic</h1>
      <p>क्लीनिक प्रबंधन सॉफ्टवेयर</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">उपयोगकर्ता नाम (Username)</label>
        <input type="text" id="username" class="form-control" placeholder="doctor / reception" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">पासवर्ड (Password)</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg" id="loginBtn">
        🔐 लॉगिन करें
      </button>
    </form>
    <div class="login-footer">
      डिफ़ॉल्ट: doctor/doctor123 · reception/reception123
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'लॉगिन हो रहा है...';
      btn.disabled = true;
      const resp = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await resp.json();
      if (data.success) {
        window.location.href = data.role === 'doctor' ? '/doctor' : '/reception';
      } else {
        const err = document.getElementById('errorMsg');
        err.textContent = data.message;
        err.style.display = 'block';
        btn.textContent = '🔐 लॉगिन करें';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
